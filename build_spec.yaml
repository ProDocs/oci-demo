version: 0.1
component: build
timeoutInSeconds: 3600
runAs: root
shell: bash

env:
  variables:
    AI_REVIEW_MODE: "oci"
    AI_REVIEW_SCENARIO: "auto"
    AI_REVIEW_AUTH_MODE: "resource_principal"
    AI_REVIEW_GENAI_INFERENCE_ENDPOINT: "https://inference.generativeai.us-chicago-1.oci.oraclecloud.com"
    AI_REVIEW_GENAI_COMPARTMENT_OCID: "ocid1.compartment.oc1..aaaaaaaa67sqqec4ey75sr5xjzxis4uqihqlf4t4x567ilbe2uku6qjwyrzq"
    AI_REVIEW_GENAI_MODEL: "ocid1.generativeaimodel.oc1.us-chicago-1.amaaaaaask7dceyape7rpwgu3easuwj4hk3e37uy2tswqdp7wvdh4ff7efsq"
    JAVA_HOME: "/usr/lib64/graalvm/graalvm-java21"
  exportedVariables:
    - AI_REVIEW_RESULT
    - BUILD_OUTCOME
    - ARTIFACT_VERSION

steps:
  - type: Command
    name: "Prepare workspace"
    command: |
      set -euo pipefail
      resolve_python_bin() {
        if [ -x /usr/bin/python3.11 ]; then
          echo /usr/bin/python3.11
          return
        fi
        if command -v python3.11 >/dev/null 2>&1; then
          command -v python3.11
          return
        fi
        command -v python3
      }
      cd "${OCI_PRIMARY_SOURCE_DIR}"
      echo "Working directory: $(pwd)"
      mkdir -p dist
      export ARTIFACT_VERSION="run-$(date -u +%Y%m%d%H%M%S)"
      echo "ARTIFACT_VERSION=${ARTIFACT_VERSION}"
      export PYTHON_BIN="$(resolve_python_bin)"
      echo "PYTHON_BIN=${PYTHON_BIN}"
      "${PYTHON_BIN}" --version
      if "${PYTHON_BIN}" -c 'import importlib.util, sys; sys.exit(0 if importlib.util.find_spec("oci") else 1)'; then
        "${PYTHON_BIN}" -c 'import sys, oci; print("python_executable=" + sys.executable); print("oci-sdk=present version=" + getattr(oci, "__version__", "unknown"))'
      else
        echo "Installing OCI Python SDK from Oracle Linux repositories..."
        yum list python3.11-oci-sdk || true
        yum -y install python3.11-oci-sdk || \
        yum -y install --enablerepo=ol8_addons python3.11-oci-sdk || \
        yum -y install --enablerepo=ol8_developer python3.11-oci-sdk
        export PYTHON_BIN="$(resolve_python_bin)"
        "${PYTHON_BIN}" -c 'import sys, oci; print("python_executable=" + sys.executable); print("oci-sdk=installed version=" + getattr(oci, "__version__", "unknown"))'
      fi

  - type: Command
    name: "AI architecture review"
    command: |
      set -euo pipefail
      resolve_python_bin() {
        if [ -x /usr/bin/python3.11 ]; then
          echo /usr/bin/python3.11
          return
        fi
        if command -v python3.11 >/dev/null 2>&1; then
          command -v python3.11
          return
        fi
        command -v python3
      }
      cd "${OCI_PRIMARY_SOURCE_DIR}"
      export PYTHON_BIN="$(resolve_python_bin)"
      echo "PYTHON_BIN=${PYTHON_BIN}"
      "${PYTHON_BIN}" -c 'import sys, oci; print("python_executable=" + sys.executable); print("oci-sdk=available version=" + getattr(oci, "__version__", "unknown"))'
      echo "Working directory: $(pwd)"
      test -f docs/architecture-guidelines.md
      test -d src/main/java
      test -f tools/ai_review/main.py
      "${PYTHON_BIN}" -m tools.ai_review.main \
        --guidelines docs/architecture-guidelines.md \
        --source-dir src/main/java \
        --output ai-review.json
      cp ai-review.json dist/ai-review.json
      cat ai-review.json
      export AI_REVIEW_RESULT="$("${PYTHON_BIN}" -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["result"])' ai-review.json)"

  - type: Command
    name: "Gate native build"
    command: |
      set -euo pipefail
      cd "${OCI_PRIMARY_SOURCE_DIR}"
      bash scripts/gate-ai-review.sh ai-review.json
    onFailure:
      - type: Command
        name: "Package blocked artifacts"
        command: |
          set -euo pipefail
          cd "${OCI_PRIMARY_SOURCE_DIR}"
          export BUILD_OUTCOME=BLOCKED
          bash scripts/package-demo-bundle.sh "${BUILD_OUTCOME}"

  - type: Command
    name: "Install GraalVM 21"
    command: |
      set -euo pipefail
      cd "${OCI_PRIMARY_SOURCE_DIR}"
      cat /etc/os-release
      yum repolist
      yum repolist all | grep -E 'ol8_codeready_builder|ol8_oci_included' || true
      yum list "graalvm-21*" || true
      yum -y install \
        --enablerepo=ol8_codeready_builder \
        gcc \
        glibc-devel \
        glibc-static \
        libstdc++-static \
        zlib-devel \
        zlib-static
      yum -y install \
        --enablerepo=ol8_codeready_builder \
        graalvm-21-native-image
    onFailure:
      - type: Command
        name: "Package artifacts after GraalVM install failure"
        command: |
          set -euo pipefail
          cd "${OCI_PRIMARY_SOURCE_DIR}"
          export BUILD_OUTCOME=GRAALVM_SETUP_FAILED
          bash scripts/package-demo-bundle.sh "${BUILD_OUTCOME}"

  - type: Command
    name: "Set GraalVM PATH"
    command: |
      set -euo pipefail
      cd "${OCI_PRIMARY_SOURCE_DIR}"
      export PATH="${JAVA_HOME}/bin:${PATH}"
      java -version
      native-image --version
    onFailure:
      - type: Command
        name: "Package artifacts after GraalVM setup failure"
        command: |
          set -euo pipefail
          cd "${OCI_PRIMARY_SOURCE_DIR}"
          export BUILD_OUTCOME=GRAALVM_SETUP_FAILED
          bash scripts/package-demo-bundle.sh "${BUILD_OUTCOME}"

  - type: Command
    name: "Build native executable"
    command: |
      set -euo pipefail
      cd "${OCI_PRIMARY_SOURCE_DIR}"
      export PATH="${JAVA_HOME}/bin:${PATH}"
      mvn -version
      mvn -Pnative -DskipTests package
    onFailure:
      - type: Command
        name: "Package artifacts after native build failure"
        command: |
          set -euo pipefail
          cd "${OCI_PRIMARY_SOURCE_DIR}"
          export BUILD_OUTCOME=NATIVE_BUILD_FAILED
          bash scripts/package-demo-bundle.sh "${BUILD_OUTCOME}"

  - type: Command
    name: "Package demo artifacts"
    command: |
      set -euo pipefail
      cd "${OCI_PRIMARY_SOURCE_DIR}"
      export BUILD_OUTCOME=SUCCESS
      bash scripts/package-demo-bundle.sh "${BUILD_OUTCOME}"

outputArtifacts:
  - name: ai-review-json
    type: BINARY
    location: dist/ai-review.json
  - name: native-binary
    type: BINARY
    location: target/oci-ai-review-demo
  - name: demo-bundle
    type: BINARY
    location: dist/demo-bundle.zip
